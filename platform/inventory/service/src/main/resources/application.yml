server:
  port: 8202

spring:
  application:
    name: platform-inventory

  # Nacos service discovery and config center
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml

  # Datasource
  #
  # 读写分离（scm-common-data-rw）说明：
  #   1. dynamic-datasource 显式关闭：rw 开启时由 ReadWriteAutoConfiguration 直接提供
  #      DataSource，避免 baomidou 动态数据源再包一层（那会要求额外配置 primary）。
  #   2. rw.enabled 关闭时，上面的 spring.datasource.* 仍是普通单库配置，行为不变。
  #   3. 从库默认指向 DB_HOST（开发环境无真实备库），验证路由链路用；生产必须设置
  #      DB_SLAVE_HOST / DB_SLAVE_PORT / DB_SLAVE_USERNAME / DB_SLAVE_PASSWORD，
  #      并保证从库账号只有只读权限。
  #   4. 启用后未注解的 SELECT 只在 Web 请求线程内走从库；异步线程、定时任务、
  #      启动期 Flyway 都走主库（default-target=MASTER）。
  #   5. 应用就绪后会异步预热从库连接并记录耗时（不阻塞启动）；Sentinel 熔断、
  #      LEAST_CONNECTIONS 实时连接计数、@DS 启动期冲突校验均已接入。
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_inventory?stringtype=unspecified
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

    dynamic:
      enabled: false

    rw:
      enabled: true
      # 没有注解也没有 SQL 决策时的兜底目标。必须是主库：写后立刻读、异步任务、
      # 定时任务都不允许读到复制延迟内的旧数据。
      default-target: MASTER
      # 同一线程写操作后该窗口内的读强制走主库（只能规避同一线程的写后读）
      read-master-after-write: 2s
      # 复制延迟超过该阈值的从库会被标记不可用并回退主库
      replication-lag-tolerance: 1s
      load-balance: ROUND_ROBIN
      health-check-enabled: true
      health-check-interval: 30s
      slave-retry-count: 3
      # 首次连接探测失败即熔断该从库（下一次请求直接回退主库）
      fail-fast-on-slave-connection-failure: true
      # 从库故障不回退整个服务健康状态，避免 K8s 误重启
      slave-down-affects-health: false
      # Sentinel 熔断：统计一次从库连接从获取到关闭的耗时/异常比例；
      # 打开后窗口内直接走主库，窗口结束允许一次试探
      circuit-breaker:
        enabled: true
        slow-rt-ms: 500
        slow-ratio-threshold: 0.5
        error-ratio: 0.5
        time-window-seconds: 30
        min-request-amount: 10
        stat-interval-ms: 10000
      groups:
        inventory:
          master:
            url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/db_inventory?stringtype=unspecified
            username: ${DB_USERNAME:admin}
            password: ${DB_PASSWORD:changeme}
            driver-class-name: org.postgresql.Driver
            maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
            minimum-idle: ${DB_POOL_MIN_IDLE:5}
            connection-timeout: 30s
          slaves:
            - name: slave1
              url: jdbc:postgresql://${DB_SLAVE_HOST:${DB_HOST:localhost}}:${DB_SLAVE_PORT:${DB_PORT:5432}}/db_inventory?stringtype=unspecified
              username: ${DB_SLAVE_USERNAME:${DB_USERNAME:admin}}
              password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD:changeme}}
              driver-class-name: org.postgresql.Driver
              maximum-pool-size: ${DB_SLAVE_POOL_MAX_SIZE:20}
              minimum-idle: ${DB_SLAVE_POOL_MIN_IDLE:5}
              # 从库连接探测要快失败，不能把请求线程挂在上面的 30s 默认值
              connection-timeout: 5s
              weight: 1
              available: true

  # Kafka producer (for transactional outbox poller)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# Seata distributed transaction
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-tx-group

  # Use Nacos as config center
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      data-id: seataServer.properties
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

  # Use Nacos as registry center
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_SERVER:localhost:8848}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP
      cluster: default
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

  # Client config
  client:
    rm:
      async-commit-buffer-limit: 10000
      report-retry-count: 5
      table-meta-check-enable: true
      report-success-enable: false
      saga-branch-register-enable: false
      saga-json-parser: fastjson
      lock:
        retry-interval: 10
        retry-times: 30
        retry-policy-branch-rollback-on-conflict: true
    tm:
      commit-retry-count: 5
      rollback-retry-count: 5
      degrade-check: false
      degrade-check-period: 2000
      degrade-check-allow-times: 10
    undo:
      data-validation: true
      log-serialization: jackson
      log-table: undo_log
      only-care-update-columns: true
    log:
      exceptionRate: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,seata,readwrite
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true

# XXL-Job
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://localhost:8088/}
    executor:
      appname: platform-inventory-executor
      address:
      ip:
      port: 9998
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30
    accessToken: default_token

# Logging
cognora:
  security:
    headers:
      content-type-options-enabled: true
      frame-options: DENY
      hsts-enabled: true
      hsts-max-age: 31536000
      hsts-include-subdomains: true
  inventory:
    alert:
      # Comma-separated user ids that receive stock alerts when the alert row names none.
      notify-user-ids: ${INVENTORY_ALERT_NOTIFY_USER_IDS:}
    # 智能补货的跨服务只读依赖。
    replenishment:
      # 采购在途量：available + inTransit 才决定是否触发补货，漏算会重复下单。
      purchase-in-transit:
        enabled: ${REPL_PURCHASE_IN_TRANSIT_ENABLED:true}
        service-id: ${PURCHASE_SERVICE_ID:scm-purchase}
        # 补货是批处理，下游卡住不能把一轮计算拖到分钟级；超时后降级为「仅建议在途」。
        connect-timeout-ms: 2000
        read-timeout-ms: 5000
      # SKU→material 映射：转采购计划时必需，缺失则该单转不过去（不猜编码）。
      product-lookup:
        enabled: ${REPL_PRODUCT_LOOKUP_ENABLED:true}
        service-id: ${PRODUCT_SERVICE_ID:platform-product}
        connect-timeout-ms: 2000
        read-timeout-ms: 3000

# Shared Kafka producer from scm-common-integration, used to hand stock alerts to scm-notify.
integration:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

notify:
  request-topic: ${NOTIFY_REQUEST_TOPIC:cognora.notify.events}

logging:
  level:
    root: INFO
    com.cognora.platform.inventory: DEBUG
    io.seata: INFO
    com.xxl.job: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
