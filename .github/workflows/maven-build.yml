name: SCM Platform CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: db_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install internal BOM
        run: mvn install -B -DskipTests -f bom/pom.xml

      # 双向静态校验 docs/api/openapi-scm-logistics.json 与 lms-tms controller
      # 的 (HTTP method, path) 映射；输出新增/缺失条数，任一非 0 即失败。
      - name: Validate OpenAPI snapshot against controller mappings
        run: python3 scripts/ci/check_openapi_drift.py

      # 每个 @PreAuthorize("hasAuthority('code')") 都必须能按 (path, method) 在
      # 权限目录（scripts/db/seed/*.sql）里命中同一个码；豁免端点不许带注解。
      # 报错退出码非 0 即失败；目录里查不到的端点只报 WARNING（缺口清单另见
      # docs/superpowers/specs/2026-11-12-permission-catalog-gaps.md）。
      - name: Validate permission annotations against the permission catalog
        run: python3 scripts/ci/check_permission_annotation_drift.py

      # 检查器自身的 fixture 测试（正例/反例各一套），防止护栏自己坏掉。
      - name: Test the permission annotation drift checker
        run: python3 scripts/ci/test_check_permission_annotation_drift.py

      # 映射工具与检查器的规则一致性（豁免清单、seed 目录、路径匹配窗口）。
      - name: Test permission rules conformance
        run: python3 scripts/ci/test_permission_rules_conformance.py

      # 端口冲突：两个服务的 server.port 相同，或 compose 里两个容器映射同一个宿主机端口。
      # 这类缺陷只在"第二个进程启动"时暴露，靠人工 override 记不住；静态检查是 CI 里
      # 唯一能自动发现它的手段。每加一个服务/容器都应保持这里为 0 冲突。
      - name: Validate no port conflicts
        run: python3 scripts/ci/check_port_conflicts.py

      # ecom 的 8 个 k8s 清单由脚本生成（数据库名/端口来自各自 application.yml）。
      # --check 同时做两件事：表和代码是否一致，签入的清单是否已过期。
      - name: Validate ecom k8s manifests are up to date
        run: python3 scripts/gen_ecom_k8s_manifests.py --check

      - name: Initialize databases
        if: github.event_name == 'push'
        env:
          PG_ADMIN_USER: admin
          PG_ADMIN_PASSWORD: admin123
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd scripts/db && bash init-all-databases.sh

      - name: Validate schema — all tables must have tenant_id
        if: github.event_name == 'push'
        env:
          PGPASSWORD: admin123
        run: |
          # `-v ON_ERROR_STOP=1` makes psql exit non-zero on the first SQL
          # error so the bash `|| exit 1` guard actually triggers.
          # Without it, RAISE EXCEPTION inside the DO block only logs
          # to stderr while psql exits 0, silently passing CI.
          for db in db_user db_org db_permission db_product db_inventory db_order db_warehouse db_logistics db_supplier db_purchase db_finance db_audit db_notify db_approval; do
            echo "Checking $db..."
            psql -h localhost -U admin -d "$db" -v ON_ERROR_STOP=1 -f scripts/db/ci_validate_tenant_id.sql || exit 1
          done

      - name: Validate role scope — ROLE_TENANT_ADMIN must not hold tenant:*
        if: github.event_name == 'push'
        env:
          PGPASSWORD: admin123
        run: |
          # 端到端断言（真实 PostgreSQL）：
          # 夹具制造历史越权（tenant:* 已绑定到 ROLE_TENANT_ADMIN）+ 一条对照业务权限，
          # 007 迁移回收 tenant:*，校验脚本断言 0 条，再断言对照组未被误删。
          psql -h localhost -U admin -d db_permission -v ON_ERROR_STOP=1 \
            -f scripts/db/ci_fixture_tenant_admin_scope.sql
          psql -h localhost -U admin -d db_permission -v ON_ERROR_STOP=1 \
            -f scripts/db/migrations/007_strip_tenant_scope_from_tenant_admin.sql
          # 008 回收非平台角色的 menu:tenant% 菜单权限，校验脚本同时断言控制台门禁。
          psql -h localhost -U admin -d db_permission -v ON_ERROR_STOP=1 \
            -f scripts/db/migrations/008_platform_console_gate.sql
          psql -h localhost -U admin -d db_permission -v ON_ERROR_STOP=1 \
            -f scripts/db/ci_validate_tenant_admin_scope.sql
          psql -h localhost -U admin -d db_permission -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE kept INT;
          BEGIN
              SELECT count(*)
                INTO kept
                FROM sys_role_permission rp
                JOIN sys_role r ON r.id = rp.role_id
                JOIN sys_permission p ON p.id = rp.permission_id
               WHERE r.role_code = 'ROLE_TENANT_ADMIN'
                 AND p.permission_code = 'product:brand:view';
              IF kept <> 1 THEN
                  RAISE EXCEPTION '对照权限被误删：product:brand:view 剩余 % 条', kept;
              END IF;
          END $$;
          SQL

      - name: Build and Run Unit Tests (PR)
        if: github.event_name == 'pull_request'
        run: mvn clean test-compile test -B -V -f com.scm.parent/pom.xml

      - name: Build, Test and Generate Coverage (Push)
        if: github.event_name == 'push'
        run: mvn clean verify -B -V -f com.scm.parent/pom.xml

      - name: Upload Coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        continue-on-error: true
        with:
          files: '**/target/site/jacoco/jacoco.xml'
          flags: unittests
          name: codecov-cognora-aura-platform

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Scan for mojibake artifacts (report only)
        continue-on-error: true
        run: node scripts/quality/check-mojibake.mjs

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  # 覆盖率门禁（P1-2）。父 POM 里 jacoco.skip=true，所以 `mvn verify` 从不执行
  # JaCoCo 的 70%/60% 规则——门禁形同虚设。这里真正执行它，但按模块传入基线阈值：
  # 实测水位是 27%~72%，一刀切要求 70/60 会让构建长期变红，而长期红的门禁很快又会被
  # 关掉。基线在 scripts/ci/coverage-baseline.tsv，只允许上调（棘轮）。
  # 说明见 docs/development/COVERAGE_GATE.md。
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install internal BOM
        run: mvn install -B -DskipTests -f bom/pom.xml

      - name: Install the root aggregator POM
        run: |
          # `com.scm.parent/pom.xml` IS `com.cognora:cognora-aura-platform` (packaging: pom),
          # and every module below it declares it as its parent. Maven resolves a parent POM
          # from the repository, not from the reactor, so on a clean runner the gated modules
          # fail with "Could not find artifact com.cognora:cognora-aura-platform:pom:2.2.0"
          # as soon as they are built with -pl instead of as part of a full reactor run.
          #
          # A developer's ~/.m2 usually has it from an earlier `mvn install`, which is exactly
          # why this only showed up in CI.
          mvn install -B -N -DskipTests -f com.scm.parent/pom.xml

      - name: Install shared modules the gated modules compile against
        run: |
          # A gated module cannot resolve its internal dependencies from a bare reactor run,
          # so install the shared libraries and the api modules they consume first (tests
          # skipped; coverage only cares about the gated module's own bytecode).
          #
          # Enumerating them by hand does not scale — installing just the platform-common
          # set left ecom-payment-service unable to find ecom-payment-api / scm-order-api,
          # and each new gated module would need its own list. `-am` (also-make) pulls in
          # whatever the listed modules depend on, so the list only has to name the four
          # gated modules themselves.
          #
          # `-am` here is safe for coverage: this step only *installs*, and the verify run
          # in the next step is still scoped to the single module, so JaCoCo reports on that
          # module's bytecode alone.
          mvn install -B -DskipTests -q -f com.scm.parent/pom.xml -am \
            -pl ../platform/gateway,../ecom/payment/service,../ecom/order-center/service,../platform/common/web

      - name: Run coverage gate for every baseline entry
        run: |
          set -euo pipefail
          status=0
          # Skip comments and blank lines; tabs separate the three columns.
          while IFS=$'\t' read -r module line_min branch_min; do
            case "${module}" in
              ''|'#'*) continue ;;
            esac
            echo "::group::coverage gate ${module} (line>=${line_min}, branch>=${branch_min})"
            log="$(mktemp)"
            if ! mvn verify -B -f com.scm.parent/pom.xml -pl "${module}" \
                 -Djacoco.skip=false \
                 -Djacoco.line.minimum="${line_min}" \
                 -Djacoco.branch.minimum="${branch_min}" 2>&1 | tee "${log}"; then
              # A dependency/build failure is not a coverage regression. Reporting one as
              # "below its baseline" sends the reader looking for missing tests that would
              # not have helped; say which it is.
              if grep -qE 'Could not (resolve|collect|find) dependencies|Failed to read artifact descriptor|Could not find artifact' "${log}"; then
                echo "::error title=Coverage gate could not build::${module} failed to resolve its dependencies, so coverage was never measured. This is a build/install problem, not a coverage regression — fix the module's install step (see the 'Install shared modules' step above)."
              else
                echo "::error title=Coverage dropped::${module} is below its baseline (line>=${line_min}, branch>=${branch_min}). Add tests, or if this is a deliberate scope change, update scripts/ci/coverage-baseline.tsv with the measured values and justify it in the PR."
              fi
              status=1
            fi
            rm -f "${log}"
            echo "::endgroup::"
          done < scripts/ci/coverage-baseline.tsv
          exit "${status}"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          if-no-files-found: ignore
          path: |
            **/target/site/jacoco/
            **/target/site/jacoco-aggregate/

  # SonarCloud identity is pinned to the historical project key:
  #   - `sonar.projectKey=scm-platform` is immutable after creation — do not rename it
  #     (see docs/operations/SONARCLOUD.md for why and what a real rename would cost).
  #   - `sonar.projectName=Cognora Aura Platform` is the display name, so branding
  #     changes never require a new Sonar project.
  #   - the quality gate is configured on NEW CODE only, so legacy debt cannot turn
  #     every PR red; the gate stays on the SonarCloud side, this job only analyzes.
  #   - while `vars.SONAR_ORG` is unset the scan step is skipped and the job stays
  #     green — it must never become a permanently failing job.
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install internal BOM
        run: mvn install -B -DskipTests -f bom/pom.xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Skipped (not failed) until the repository variable SONAR_ORG exists;
      # SONAR_TOKEN (a project analysis token) must be present as a secret.
      - name: SonarCloud Scan
        if: vars.SONAR_ORG != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -f com.scm.parent/pom.xml \
            -Dsonar.projectKey=scm-platform \
            -Dsonar.projectName="Cognora Aura Platform" \
            -Dsonar.organization=${{ vars.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A missing NVD_API_KEY is a missing credential, not a defect in the
      # commit under test, so it must not paint every push red: a permanently
      # failing required-looking job trains people to ignore CI. `secrets`
      # is not available in a job-level `if`, so detect it here and let the
      # scan steps gate on the output instead. When the key IS present, the
      # scan below fails the job for real (no `continue-on-error`).
      - name: Check whether the NVD API key is configured
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "${NVD_API_KEY}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "NVD_API_KEY is configured; running the OWASP scan."
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Security scan skipped::NVD_API_KEY is not configured, so the OWASP dependency-check job is skipped. Add the repository secret NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key) to enable scanning. This is a missing credential, not a failed scan."
          fi

      - name: Set up JDK 21
        if: steps.nvd.outputs.has_key == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install internal BOM
        if: steps.nvd.outputs.has_key == 'true'
        run: mvn install -B -DskipTests -f bom/pom.xml

      - name: Cache OWASP NVD database
        if: steps.nvd.outputs.has_key == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ hashFiles('com.scm.parent/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp-nvd-

      # The report is written to the module that owns the build, not the
      # repository root: `-f com.scm.parent/pom.xml` makes com.scm.parent the
      # project basedir, so the old `target/dependency-check-report.html`
      # upload never matched a file.
      - name: Run OWASP Dependency Check
        if: steps.nvd.outputs.has_key == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -f com.scm.parent/pom.xml \
            -DfailBuildOnCVSS=9 \
            -DnvdApiKey="${NVD_API_KEY}"

      - name: Upload Security Report
        if: always() && steps.nvd.outputs.has_key == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          if-no-files-found: ignore
          path: |
            com.scm.parent/target/dependency-check-report.html
            com.scm.parent/**/target/dependency-check-report.html

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && vars.DOCKERHUB_USERNAME

    strategy:
      matrix:
        include:
          - service: platform-auth
            path: platform/auth
          - service: platform-gateway
            path: platform/gateway
          - service: platform-system
            path: platform/system
          - service: platform-product
            path: platform/product
          - service: platform-inventory
            path: platform/inventory
          - service: scm-order
            path: scm/order
          - service: scm-warehouse
            path: scm/warehouse
          - service: lms-tms
            path: lms/tms
          - service: scm-supplier
            path: scm/supplier
          - service: scm-finance
            path: scm/finance
          - service: scm-purchase
            path: scm/purchase
          - service: platform-approval
            path: platform/approval
          - service: platform-audit
            path: platform/audit
          - service: platform-notify
            path: platform/notify
          - service: platform-tenant
            path: platform/tenant
          # 电商层此前「写了不发」：8 个服务的 Dockerfile 与端口都在仓库里，但构建矩阵
          # 一个都没有，于是 ecom-* 镜像永远不会产出（P2-1）。补进来，让"代码已写"和
          # "交付可用"一致；否则运维只能手工 build，部署清单与代码长期不同步。
          - service: ecom-member
            path: ecom/member
          - service: ecom-promotion
            path: ecom/promotion
          - service: ecom-payment
            path: ecom/payment
          - service: ecom-order-center
            path: ecom/order-center
          - service: ecom-mall
            path: ecom/mall
          - service: ecom-fulfillment
            path: ecom/fulfillment
          - service: ecom-search
            path: ecom/search
          - service: ecom-analytics
            path: ecom/analytics

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install internal BOM
        run: mvn install -B -DskipTests -f bom/pom.xml

      - name: Build JAR
        run: |
          if [ -d "${{ matrix.path }}/service" ]; then
            mvn clean package -DskipTests -pl ../${{ matrix.path }}/service -am -f com.scm.parent/pom.xml
          else
            mvn clean package -DskipTests -pl ../${{ matrix.path }} -am -f com.scm.parent/pom.xml
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.path }}
          file: ./${{ matrix.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    if: github.ref == 'refs/heads/develop' && vars.DOCKERHUB_USERNAME && vars.KUBE_DEPLOY_ENABLED
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure kubectl
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy to dev namespace
        run: |
          kubectl set image deployment/platform-auth platform-auth=${{ secrets.DOCKERHUB_USERNAME }}/platform-auth:develop-${{ github.sha }} -n scm-dev
          kubectl set image deployment/platform-gateway platform-gateway=${{ secrets.DOCKERHUB_USERNAME }}/platform-gateway:develop-${{ github.sha }} -n scm-dev
          kubectl set image deployment/platform-system platform-system=${{ secrets.DOCKERHUB_USERNAME }}/platform-system:develop-${{ github.sha }} -n scm-dev
          kubectl rollout status deployment/platform-auth -n scm-dev
          kubectl rollout status deployment/platform-gateway -n scm-dev
          kubectl rollout status deployment/platform-system -n scm-dev

      - name: Verify deployment
        run: |
          kubectl get pods -n scm-dev -l app=platform-auth
          kubectl get pods -n scm-dev -l app=platform-gateway
          kubectl get pods -n scm-dev -l app=platform-system

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master' && vars.DOCKERHUB_USERNAME && vars.KUBE_DEPLOY_ENABLED
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure kubectl
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Deploy to production namespace
        run: |
          kubectl set image deployment/platform-auth platform-auth=${{ secrets.DOCKERHUB_USERNAME }}/platform-auth:master-${{ github.sha }} -n scm-prod
          kubectl set image deployment/platform-gateway platform-gateway=${{ secrets.DOCKERHUB_USERNAME }}/platform-gateway:master-${{ github.sha }} -n scm-prod
          kubectl set image deployment/platform-system platform-system=${{ secrets.DOCKERHUB_USERNAME }}/platform-system:master-${{ github.sha }} -n scm-prod
          kubectl rollout status deployment/platform-auth -n scm-prod
          kubectl rollout status deployment/platform-gateway -n scm-prod
          kubectl rollout status deployment/platform-system -n scm-prod

      - name: Verify deployment
        run: |
          kubectl get pods -n scm-prod -l app=platform-auth
