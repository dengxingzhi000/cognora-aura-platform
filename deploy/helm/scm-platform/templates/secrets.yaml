apiVersion: v1
kind: Secret
metadata:
  name: scm-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  # 注意：default 必须给「明文」，因为后面还要 b64enc。此前给的是已编码的 "YWRtaW4="，
  # 再编码一次得到 "WVdSdGFXND0="，解码后是字面量 "YWRtaW4=" —— 数据库用户名/密码是错的。
  DB_USERNAME: {{ .Values.secrets.dbUsername | default "admin" | b64enc }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | default "admin123" | b64enc }}
  # 访问令牌的 HS512 签名密钥：auth 签发、gateway 校验、每个业务服务校验，必须完全一致。
  # 没有默认值：缺失时 Helm 渲染失败，而不是渲染出一个能被任何读过仓库的人伪造令牌的常量
  # （服务侧还有 StartupSecretValidator 兜底，但让「没配」在渲染期就暴露更早、更清楚）。
  #   --set secrets.jwtSecret=$(openssl rand -base64 64)
  #   或 values-prod.yaml: secrets.jwtSecret: <真实随机值>
  jwt-secret: {{ required "secrets.jwtSecret is required (at least 64 chars; use the same value on auth, gateway and every service - generate with: openssl rand -base64 64)" .Values.secrets.jwtSecret | b64enc }}
  # 服务间 HMAC 签名密钥（审计写入通道、内部权限查询）。审计服务在缺失/占位时拒绝启动。
  api-secret-internal-service: {{ required "secrets.apiSecretInternalService is required (at least 32 chars - generate with: openssl rand -hex 32)" .Values.secrets.apiSecretInternalService | b64enc }}


